stages:
  - test
  - build
  - sync

# Run pipelines for merge requests and branches, but avoid duplicate
# branch pipelines when a merge request is open.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  image: python:3.10-slim
  variables:
    PYTHONPATH: "."
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  script:
    - pip install -r requirements.txt
    - pytest tests --cov=src --cov-report=term --cov-report=xml --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Mirrors the repository to GitHub on every push to the default branch.
# Requires a GITHUB_TOKEN CI/CD variable (masked + protected) with repo scope.
# See: https://docs.gitlab.com/ci/secrets/
# Uses alpine + apk to install git, ensuring a proper shell is available
# for the GitLab Runner script execution (alpine/git image lacks /bin/sh support).
# GIT_STRATEGY: none skips the default checkout since we do our own mirror clone.
sync-to-github:
  stage: sync
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  variables:
    # Skip default git checkout — we do a full mirror clone ourselves
    GIT_STRATEGY: none
  script:
    # Clone a full mirror of the GitLab repo using the ephemeral CI job token
    - git clone --mirror "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/aimirah1/ai-os.git" repo
    - cd repo
    # Push all branches, tags and refs to GitHub — token injected at runtime
    - git push --mirror "https://${GITHUB_TOKEN}@github.com/strdst7/ai-os.git"
  rules:
    # Only sync on pushes to the default branch (same as build job)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
